name: Build
on: [pull_request, push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: 17
          cache: gradle
      - name: Check locale strings
        run: python3 scripts/check_locale_strings.py
      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug
      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
  build:
    # 테스트가 통과한 뒤에만 APK 를 만든다. 서명 없는 디버그 빌드이며,
    # 릴리스 APK 는 사람이 태그를 만들 때 따로 서명한다 (README 운영 절).
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: 17
          cache: gradle
      - name: Build debug APK
        run: ./gradlew assembleDebug -PuniversalApk
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: rabbithole-debug-apk
          path: app/build/outputs/apk/debug/*.apk
